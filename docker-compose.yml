services:
  postgres:
    image: postgres:17-alpine
    container_name: proofpatch-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - proofpatch_postgres_data:/var/lib/postgresql/data

volumes:
  proofpatch_postgres_data: